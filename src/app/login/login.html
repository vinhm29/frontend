<main class="login-page">
  <section class="login-card">
    <p class="eyebrow">Acceso restringido</p>
    <h1>Administración</h1>
    <p class="intro">Ingresa tus credenciales para gestionar los reclamos.</p>
    <div *ngIf="error" class="notice" role="alert">{{ error }}</div>
    <form [formGroup]="loginForm" (ngSubmit)="ingresar()">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="username">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password">
      <button type="submit" [disabled]="enviando || loginForm.invalid">{{ enviando ? 'Ingresando...' : 'Ingresar' }}</button>
    </form>
  </section>
</main>
